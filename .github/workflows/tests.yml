name: tests

on:
  push:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium
      - name: Desktop run
        run: pytest --tracing retain-on-failure --output results-desktop
      - name: Mobile run (iPhone 13 viewport)
        run: pytest --tracing retain-on-failure --output results-mobile --device "iPhone 13"
      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: results-*
